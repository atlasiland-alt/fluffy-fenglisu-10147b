<!doctype html>
<html lang="en">
  <body>
    <!-- Exists only so Netlify's build-time form detection registers the
         deskwork request form. Never shown to visitors. -->
    <form name="deskwork-request" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="deskwork-request" />
      <input name="bot-field" />
      <input name="name" />
      <input name="email" type="email" />
      <textarea name="request"></textarea>
      <textarea name="background"></textarea>
      <textarea name="materials"></textarea>
      <input name="deadline" />
      <input name="avoid" />
    </form>
  </body>
</html>
